<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokédex</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --top:#a9ecef; --mid:#8ccfdc; --low:#5f8db8; --ink:#fff; --bar:rgba(70,110,150,.55); }
  * { box-sizing:border-box; margin:0; }
  html, body { overscroll-behavior-x:none; }   /* stop the trackpad's back/forward page swipe */
  html { min-height:100%; background:linear-gradient(var(--top), var(--mid) 45%, var(--low)); }
  body { color:var(--ink);
         font:900 15px/1 Lato, system-ui, sans-serif; letter-spacing:.06em; }
  main { max-width:430px; margin:0 auto; padding-bottom:110px; }
  main { touch-action:pan-y; user-select:none; -webkit-user-select:none; cursor:grab; transition:transform .2s ease-out; }
  main.drag { transition:none; cursor:grabbing; }
  main.in { animation:in .28s ease-out; }
  main.back { animation:back .28s ease-out; }
  @keyframes in { from { transform:translateX(40%); opacity:0; } }
  @keyframes back { from { transform:translateX(-40%); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { main.in, main.back { animation:none; } main { transition:none; } }
  img { display:block; width:100%; -webkit-user-drag:none; pointer-events:none; }
  .grid { display:grid; grid-template-columns:repeat(4,1fr); }
  .grid img { border-radius:9px; }
  nav { position:fixed; inset:auto 0 0; height:84px; display:flex; align-items:center; justify-content:center; gap:28px;
        background:var(--bar); border-top:2px solid rgba(255,255,255,.85); backdrop-filter:blur(6px); }
  nav button { width:52px; height:52px; border-radius:50%; border:2px solid rgba(255,255,255,.9); color:#5b6b7a;
               background:radial-gradient(#fff 60%, #dfe7ec); font:900 26px/1 Lato, sans-serif; cursor:pointer; }
  nav button:disabled { opacity:.35; cursor:default; }
  nav button:focus-visible { outline:3px solid #fff; outline-offset:3px; }
  #count { min-width:120px; text-align:center; font-size:15px; line-height:1.35; }
  #regions { position:sticky; top:0; z-index:2; display:flex; gap:8px; overflow-x:auto; padding:10px 12px;
             background:var(--bar); backdrop-filter:blur(6px); border-bottom:2px solid rgba(255,255,255,.85); scrollbar-width:none; }
  #regions button { flex:none; padding:8px 16px; border-radius:20px; border:2px solid rgba(255,255,255,.8); background:none;
                    color:#fff; font:900 13px/1 Lato, sans-serif; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  #regions button[aria-current] { background:#fff; color:#4f7fa6; }
  #regions button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  .empty { padding:40vh 24px; text-align:center; }
</style></head>
<body>
<div id="regions" role="tablist"></div>
<main id="page"></main>
<nav><button id="prev" aria-label="Previous Pokémon">‹</button><span id="count"></span><button id="next" aria-label="Next Pokémon">›</button></nav>
<script>
const R = /*DATA*/[];
const all = R.flatMap((r, ri) => r.pages.map((p, n) => ({ ...p, ri, n }))), el = document.getElementById('page');
const bar = document.getElementById('regions');
bar.innerHTML = R.map((r, ri) => `<button data-r="${ri}">${r.name}</button>`).join('');
bar.onclick = e => { const b = e.target.closest('button'); if (b) { const n = all.findIndex(p => p.ri === +b.dataset.r); show(n, n > i ? 1 : -1); } };
if (R.length < 2) bar.hidden = true;
const [hr, hn] = location.hash.slice(1).split('-').map(Number);
let i = Math.max(0, all.findIndex(p => p.ri === hr - 1 && p.n === hn - 1));
function show(n, animate) {
  if (!all.length) { el.innerHTML = '<p class="empty">No Pokémon were found in the recordings.</p>'; return; }
  i = n; const p = all[i], r = R[p.ri];
  const pad = (p.pad * 100) + '%', gap = (p.gap * 100) + '%';
  el.innerHTML = `<img src="${p.head}" alt="">` + p.blocks.map(b => b.strip ? `<img src="${b.strip}" alt="">`
    : `<div class="grid" style="padding:0 ${pad};gap:${gap}">${b.tiles.map(t => `<img src="${t}" alt="">`).join('')}</div>`).join('');
  document.getElementById('count').innerHTML = `${r.name}<br>${p.n + 1} / ${r.pages.length}`;
  bar.querySelectorAll('button').forEach(b => b.toggleAttribute('aria-current', +b.dataset.r === p.ri));
  bar.querySelector('[aria-current]')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  prev.disabled = i === 0; next.disabled = i === all.length - 1;
  history.replaceState(null, '', `#${p.ri + 1}-${p.n + 1}`); scrollTo(0, 0);
  if (animate) { el.classList.remove('in', 'back'); void el.offsetWidth; el.classList.add(animate > 0 ? 'in' : 'back'); }
}
const go = d => { const n = i + d; if (n >= 0 && n < all.length) show(n, d); };
prev.onclick = () => go(-1); next.onclick = () => go(1);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1); });
// Swipe left/right like in the app: drag with a finger or the mouse (the page follows), or two-finger swipe on a trackpad
let sx = null, sy = 0, dx = 0, horiz = false;
el.addEventListener('pointerdown', e => { if (e.button) return; sx = e.clientX; sy = e.clientY; dx = 0; horiz = false; });
addEventListener('pointermove', e => {
  if (sx === null) return;
  dx = e.clientX - sx;
  if (!horiz && Math.abs(dx) > 10 && Math.abs(dx) > 1.5 * Math.abs(e.clientY - sy)) { horiz = true; el.classList.add('drag'); }
  const edge = (dx > 0 && i === 0) || (dx < 0 && i === all.length - 1);   // resist at the first and last Pokémon
  if (horiz) el.style.transform = `translateX(${edge ? dx / 4 : dx}px)`;
});
const end = () => { if (sx === null) return; el.classList.remove('drag'); el.style.transform = '';
  if (horiz && Math.abs(dx) > 60) go(dx < 0 ? 1 : -1); sx = null; };
addEventListener('pointerup', end); addEventListener('pointercancel', end);
let acc = 0, quietUntil = 0, reset;
addEventListener('wheel', e => {
  if (Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;   // vertical scrolling stays normal
  e.preventDefault(); const now = Date.now();
  if (now < quietUntil) { quietUntil = now + 250; return; }   // ignore the rest of one swipe's momentum
  acc += e.deltaX; clearTimeout(reset); reset = setTimeout(() => acc = 0, 200);
  if (Math.abs(acc) > 60) { go(acc > 0 ? 1 : -1); acc = 0; quietUntil = now + 250; }
}, { passive: false });
show(i);
</script>
</body></html>
